version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mentecart-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: mentecart
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mentecart-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional, for future sessions/caching)
  redis:
    image: redis:7-alpine
    container_name: mentecart-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - mentecart-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentecart-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/mentecart?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production-12345}
      CART_EXPIRY_MINUTES: 15
      MAX_BOOKINGS_PER_DAY: 3
      BOOKING_CANCELLATION_CUTOFF_HOURS: 2
      CORS_ORIGIN: http://localhost:5000
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mentecart-network
    volumes:
      - ./src:/app/src
      - /app/node_modules
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  mentecart-network:
    driver: bridge